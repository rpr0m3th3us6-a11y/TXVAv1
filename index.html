<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DV100 Texas Benefits Reference</title>
<meta name="description" content="Field reference for Texas disabled-veteran benefits in the Austin metro — property tax exemptions, tolls, parking, federal VA benefits. Every entry graded against a primary source.">
<meta name="theme-color" content="#14150F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DV100">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
</head>
<body>

<style id="css">
:root{
  --ink:#14150F; --surface:#1C1E16; --surface-2:#24261C; --surface-3:#2C2F22;
  --line:#3A3D2E; --line-soft:#2A2D21;
  --bone:#E8E4D5; --muted:#9A9884; --muted-2:#736F5E;
  --brass:#C6A344; --brass-dim:#8A7330; --brass-glow:rgba(198,163,68,.13);
  --sig-ok:#7E9B5C; --sig-check:#7FA2B8; --sig-crit:#CC4E3A;
  --ok-bg:rgba(126,155,92,.12); --check-bg:rgba(127,162,184,.12); --crit-bg:rgba(204,78,58,.11);
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(16px,3.2vw,28px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--disp);text-wrap:balance;font-weight:700;line-height:1.08;letter-spacing:.01em}
p{margin:0}
a{color:var(--brass);text-underline-offset:3px;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
code,.mono{font-family:var(--mono);font-size:.9em;font-variant-numeric:tabular-nums}
.stat-num,.money{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- command bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(20,21,15,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:0 var(--pad)}
.ident{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:16px 0 12px}
.mark{font-family:var(--disp);font-size:24px;letter-spacing:.11em;text-transform:uppercase;color:var(--bone);font-weight:700}
.mark b{color:var(--brass);font-weight:700}
.ident-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.hot{border-color:rgba(204,78,58,.5);color:var(--sig-crit);background:var(--crit-bg)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:color .15s}
nav button:hover{color:var(--bone)}
nav button[aria-selected=true]{color:var(--brass);border-bottom-color:var(--brass)}
nav .tabmark{display:inline-block;width:6px;height:6px;background:var(--sig-crit);border-radius:50%;margin-left:7px;vertical-align:2px}

/* ---------- shell ---------- */
main{max-width:1120px;margin:0 auto;padding:26px var(--pad) 80px}
.view[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);margin-bottom:9px}
.lede{color:var(--muted);max-width:66ch}
.sec-h{font-size:clamp(24px,3.6vw,32px);letter-spacing:.02em;text-transform:uppercase}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line-soft);padding:var(--pad)}
.panel.flat{background:none;border:0;padding:0}
.alert{background:var(--surface);border:1px solid rgba(204,78,58,.35);border-left:4px solid var(--sig-crit);padding:var(--pad)}
.alert h2{color:var(--sig-crit);font-size:clamp(22px,3.4vw,30px);text-transform:uppercase;letter-spacing:.02em}
.rule{height:1px;background:var(--line-soft);border:0;margin:0}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.stat{background:var(--surface);padding:14px 16px}
.stat dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.stat dd{margin:0;font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.05}
.stat dd small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:3px;line-height:1.4}
.stat.crit dd{color:var(--sig-crit)}
.stat.ok dd{color:var(--sig-ok)}
.stat.brass dd{color:var(--brass)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2.5px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--sig-ok);border-color:rgba(126,155,92,.4);background:var(--ok-bg)}
.chip.check{color:var(--sig-check);border-color:rgba(127,162,184,.4);background:var(--check-bg)}
.chip.crit{color:var(--sig-crit);border-color:rgba(204,78,58,.4);background:var(--crit-bg)}
.chip.money{color:var(--brass);border-color:rgba(198,163,68,.4);background:var(--brass-glow)}
.chip-row{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- decision tree ---------- */
.tree{border:1px solid var(--line);background:var(--surface-2)}
.tree-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px var(--pad);border-bottom:1px solid var(--line);background:var(--surface-3)}
.tree-head h3{font-size:17px;letter-spacing:.09em;text-transform:uppercase}
.steps{margin-left:auto;display:flex;gap:5px;align-items:center}
.dot{width:9px;height:9px;border:1px solid var(--brass-dim);border-radius:50%}
.dot.on{background:var(--brass);border-color:var(--brass)}
.dot.done{background:var(--brass-dim);border-color:var(--brass-dim)}
.tree-body{padding:var(--pad)}
.q{font-family:var(--disp);font-size:clamp(20px,3vw,26px);font-weight:600;letter-spacing:.01em;margin-bottom:6px;text-transform:none}
.q-note{color:var(--muted);font-size:14px;margin-bottom:18px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);color:var(--bone);padding:13px 15px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brass);background:var(--surface-3)}
.opt-key{font-family:var(--mono);font-size:11px;color:var(--brass);border:1px solid var(--brass-dim);padding:1px 6px;flex:none;margin-top:2px}
.opt-t{font-weight:600;display:block}
.opt-d{color:var(--muted);font-size:13.5px;display:block;margin-top:2px}
.tree-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px var(--pad);border-top:1px solid var(--line)}
.btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.trail{font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.04em}

/* ---------- outcome ---------- */
.outcome{border-left:4px solid var(--brass);background:var(--surface);padding:var(--pad)}
.outcome.crit{border-left-color:var(--sig-crit)}
.outcome.ok{border-left-color:var(--sig-ok)}
.outcome h4{font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.outcome h4{color:var(--brass)}
.outcome.crit h4{color:var(--sig-crit)}
.outcome.ok h4{color:var(--sig-ok)}
.do-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:11px}
.do-list li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.do-n{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--brass);width:19px;height:19px;display:grid;place-items:center;flex:none;margin-top:2px;font-weight:600}

/* ---------- three losses ---------- */
.losses{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.loss{border:1px solid var(--line-soft);background:var(--surface);padding:16px;position:relative}
.loss-n{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--brass-dim);line-height:1;margin-bottom:8px}
.loss h4{font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.loss p{font-size:13.5px;color:var(--muted)}

/* ---------- tracker ---------- */
.prog-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:6px}
.prog{flex:1;min-width:180px;height:7px;background:var(--surface-3);border:1px solid var(--line-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);transition:width .35s ease}
.tier{margin-top:22px}
.tier-h{display:flex;align-items:baseline;gap:11px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.tier-h h3{font-size:17px;letter-spacing:.09em;text-transform:uppercase}
.tier-h span{font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.06em}
.task{display:flex;gap:14px;align-items:flex-start;padding:14px 15px 14px 12px;border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;transition:background .15s}
.task:hover{background:var(--surface)}
.task[data-sev=crit]{border-left-color:var(--sig-crit)}
.task[data-sev=high]{border-left-color:var(--brass)}
.task[data-sev=std]{border-left-color:var(--line)}
.task input{appearance:none;width:19px;height:19px;border:1.5px solid var(--muted-2);background:none;flex:none;margin-top:2px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.task input:hover{border-color:var(--brass)}
.task input:checked{background:var(--brass);border-color:var(--brass)}
.task input:checked::after{content:"";width:5px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(42deg) translate(-1px,-1px)}
.task-b{flex:1;min-width:0}
.task-t{font-weight:600;font-size:15px;display:block;margin-bottom:3px}
.task-d{color:var(--muted);font-size:13.5px;display:block}
.task.done .task-t,.task.done .task-d{color:var(--muted-2);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.task-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

/* ---------- benefit grid ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.filters button{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;cursor:pointer;transition:.15s}
.filters button:hover{color:var(--bone);border-color:var(--muted-2)}
.filters button[aria-pressed=true]{background:var(--brass-glow);border-color:var(--brass);color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{border:1px solid var(--line-soft);background:var(--surface);padding:17px;display:flex;flex-direction:column;gap:9px}
.card h4{font-size:17px;letter-spacing:.02em;text-transform:none;line-height:1.22}
.card .val{font-family:var(--mono);font-size:13px;color:var(--brass);font-variant-numeric:tabular-nums}
.card p{font-size:13.5px;color:var(--muted)}
.card .src{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);margin-top:auto;padding-top:9px;border-top:1px solid var(--line-soft);letter-spacing:.04em}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column;border:1px solid var(--line-soft)}
.rung{display:grid;grid-template-columns:82px 1fr;gap:0;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.rung:last-child{border-bottom:0}
.rung-n{font-family:var(--disp);font-size:25px;font-weight:700;color:var(--muted-2);display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-right:1px solid var(--line-soft);letter-spacing:.01em}
.rung-b{padding:13px 17px}
.rung-b ul{margin:6px 0 0;padding-left:17px;color:var(--muted);font-size:13.5px}
.rung-b li{margin-bottom:3px}
.rung.you{background:var(--brass-glow)}
.rung.you .rung-n{color:var(--ink);background:var(--brass)}
.rung.you .rung-b h4{color:var(--brass)}
.rung-b h4{font-size:15px;letter-spacing:.07em;text-transform:uppercase}

/* ---------- calendar ---------- */
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.mo{background:var(--surface);padding:10px 8px;min-height:98px}
.mo-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted-2);text-transform:uppercase;margin-bottom:7px}
.mo.hit{background:var(--surface-2)}
.mo.hit .mo-n{color:var(--brass)}
.mo p{font-size:12px;color:var(--muted);line-height:1.42}

/* ---------- contacts ---------- */
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.call{border:1px solid var(--line-soft);background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:4px}
.call .who{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.call a{font-family:var(--mono);font-size:17px;letter-spacing:.02em;text-decoration:none;font-variant-numeric:tabular-nums}
.call a:hover{text-decoration:underline}
.call .why{font-size:13px;color:var(--muted)}

/* ---------- misc ---------- */
.warn{border:1px dashed rgba(204,78,58,.45);background:var(--crit-bg);padding:15px 17px}
.warn h4{color:var(--sig-crit);font-size:15px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.warn p{font-size:13.5px;color:var(--muted)}
.foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted-2);max-width:72ch}
.save-note{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- install affordance ---------- */
.install{background:var(--brass-glow);border:1px solid var(--brass);color:var(--brass);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;cursor:pointer}
.install:hover{background:var(--brass);color:var(--ink)}
.offline-note{display:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--sig-check);border:1px solid rgba(127,162,184,.4);background:var(--check-bg);padding:3px 8px}
body.is-offline .offline-note{display:inline-block}

/* ---------- safe areas (punch-hole, gesture bar, Fold hinge) ---------- */
.bar-in{padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right))}
main{padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right))}

/* ---------- phone: nav becomes a thumb-reachable bottom bar ---------- */
@media(max-width:760px){
  .rung{grid-template-columns:62px 1fr}
  .rung-n{font-size:20px}
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .ident{padding:11px 0 9px}
  .mark{font-size:20px}
  .ident-sub{display:none}
  .pills{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
  .pills::-webkit-scrollbar{display:none}
  /* backdrop-filter on an ancestor becomes the containing block for
     position:fixed descendants — drop it here or the nav anchors to the bar */
  .bar{backdrop-filter:none;background:var(--ink)}
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(20,21,15,.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    justify-content:space-around;overflow:visible;
  }
  nav button{flex:1;border-bottom:0;border-top:2px solid transparent;font-size:12.5px;letter-spacing:.06em;padding:12px 2px 13px;text-align:center}
  nav button[aria-selected=true]{border-bottom-color:transparent;border-top-color:var(--brass)}
  nav .tabmark{margin-left:4px;width:5px;height:5px;vertical-align:1px}
  main{padding-top:20px}
  .task{padding:13px 10px 13px 11px}
  .task input{width:23px;height:23px}
  .opt{padding:14px 13px}
  .call a{font-size:19px}
}

/* ---------- rating selector ---------- */
.ratepick{display:flex;gap:3px;align-items:center;flex-wrap:nowrap}
.ratepick button{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:3px 7px;cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums}
.ratepick button:hover{border-color:var(--muted-2);color:var(--bone)}
.ratepick button[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.ratepick .sep{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}
#ratelabel{border-color:rgba(198,163,68,.45);color:var(--brass);background:var(--brass-glow)}
body.has-rating #ratelabel{display:none}

/* benefits gated below the selected rating */
.card.gated{opacity:.34}
.card.gated .val{color:var(--muted-2)}
.gate-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;
  border:1px solid var(--line-soft);background:var(--surface);padding:10px 13px}
.gate-bar p{font-size:13px;color:var(--muted);margin:0}
.gate-bar b{color:var(--brass);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* label swap: full words on roomy screens, short ones in the bottom bar */
.lbl-s{display:none}

/* ---------- Fold cover screen: very narrow ---------- */
@media(max-width:440px){
  .stats{grid-template-columns:1fr 1fr}
  .stat dd{font-size:22px}
  .losses{grid-template-columns:1fr}
  nav button{font-size:11.5px;letter-spacing:.01em;padding:12px 1px 13px}
  .lbl-l{display:none}
  .lbl-s{display:inline}
  nav button:not(:has(.lbl-s)) .lbl-l{display:inline}
}

/* ---------- Fold unfolded: wide but short, near-square ---------- */
@media(min-width:700px) and (max-height:820px) and (orientation:portrait){
  .sec-h{font-size:26px}
  main{padding-top:18px}
  .stack{gap:20px}
}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="ident">
      <span class="mark">DV<b>100</b></span>
      <span class="ident-sub">Texas Benefits Reference &middot; Central Texas &middot; Rev 2026.09.11</span>
      <div class="pills">
        <span class="pill" id="ratelabel">Set your rating &rarr;</span>
        <div class="ratepick" id="ratepick" role="group" aria-label="Your VA disability rating"></div>
        <span class="offline-note" id="offline">Offline &middot; cached</span>
        <button class="install" id="install" hidden>Install</button>
      </div>
    </div>
    <nav id="nav" role="tablist" aria-label="Sections"></nav>
  </div>
</header>

<main id="app-root">
  <p style="color:var(--muted)">Loading reference&hellip;</p>
</main>

<script id="app">
(function(){
"use strict";

/* ============ DATA ============ */

var TASKS = [
  {id:"cad-status", tier:1, sev:"crit", t:"Pull your appraisal notice and read the exemption block",
   d:"Everything downstream branches off this. You need to know which exemptions are actually on the roll for your property, and the first year each was granted. Hays CAD and Travis CAD both file online.",

function renderTriage(){
  var o='';
  o+='<section class="alert">';
  o+='<div class="eyebrow">The trap in the biggest benefit</div>';
  o+='<h2>The homestead exemption doesn\'t survive a tenant</h2>';
  o+='<p class="lede" style="margin-top:12px">§11.131 is not a veteran-status exemption — it is a <b>homestead</b> exemption. It cross-references §11.13, and §11.13(j)(1)(D) requires the property be <b>“occupied as the individual’s principal residence by an owner.”</b> A tenant in the whole house satisfies “used as a residence” but fails the owner-occupancy element.</p>';
  o+='<p class="lede" style="margin-top:12px">And §11.42(a) makes qualification a <b>January 1 snapshot</b> with no mid-year proration for losing it. Hays CAD has been under a statutory mandate since 2024 to review every homestead exemption in the county at least once every five years. This is not a question of whether they notice.</p>';
  o+='</section>';

  o+='<dl class="stats">';
  o+='<div class="stat crit"><dt>Lookback exposure</dt><dd>5 yrs<small>§11.43(i) says five; §25.21 says three. Plan for five.</small></dd></div>';
  o+='<div class="stat crit"><dt>Value at risk per year</dt><dd>100%<small>Of the entire tax bill — not a slice of it</small></dd></div>';
  o+='<div class="stat brass"><dt>Audit cycle closes</dt><dd>2028<small>§11.43(h-1), first cycle began Jan 2024</small></dd></div>';
  o+='<div class="stat ok"><dt>Penalty on discovery</dt><dd>None<small>Ch. 33 attaches on delinquency, not discovery</small></dd></div>';
  o+='</dl>';

  o+='<section class="panel flat"><div class="eyebrow">Where you actually stand</div><h2 class="sec-h">Run the branch</h2>';
  o+='<p class="lede" style="margin-top:10px;margin-bottom:18px">Three questions separate three very different situations. Two of them are survivable and one of them is nearly a non-event — but they call for opposite actions, so guessing is the one thing that doesn’t work.</p>';
  o+='<div class="tree" id="tree"></div></section>';

  o+='<section class="panel flat"><div class="eyebrow">If the exemption goes</div><h2 class="sec-h">Three losses, not one</h2>';
  o+='<p class="lede" style="margin:10px 0 18px">The back taxes are the part everyone counts. The third one is usually worth more, and almost nobody accounts for it.</p>';
  o+='<div class="losses">';
  o+='<div class="loss"><div class="loss-n">01</div><h4>The exemption</h4><p>§11.131 exempted 100% of appraised value. Losing it means the full taxable value for every year it shouldn’t have applied, computed at that year’s rate under §26.09(d).</p></div>';
  o+='<div class="loss"><div class="loss-n">02</div><h4>The 10% cap</h4><p>§23.23(c) ties the appraisal cap to holding a §11.13 exemption. It expires the same January 1. The district has tracked uncapped market value all along — there is no phase-in, and assessed value steps straight to market.</p></div>';
  o+='<div class="loss"><div class="loss-n">03</div><h4>The cap’s history</h4><p>When you reoccupy, the cap restarts from scratch — anchored to the new, higher market value, effective the January after you requalify. Every year of accumulated cap benefit is permanently gone.</p></div>';
  o+='</div></section>';

  o+='<section class="panel flat"><div class="eyebrow">The most common wrong answer online</div><h2 class="sec-h">Retroactive awards and back years</h2>';
  o+='<div class="panel" style="margin-top:14px"><p style="font-size:15.5px"><b style="color:var(--brass)">If your VA award was backdated, does the exemption go back with it?</b> Almost certainly not — and the reasoning matters, because this is the single most confidently mis-stated point in every veteran forum thread on Texas property tax.</p>';
  o+='<p style="margin-top:13px;color:var(--muted)"><b>Texas has no statute tying the exemption to a VA award’s retroactive effective date.</b> The five-year window in §11.439 extends the <i>filing deadline</i>, not eligibility — you must have independently owned and occupied the property in each year claimed. A bill that would have created exactly that retroactive rule, proposed §11.4311 in SB 1154 (2015), died in the House. The legislature passed HB 626 in 2017 instead: a pure deadline extension. Even the failed bill would have required the veteran to be “otherwise qualified” each year.</p>';
  o+='<p style="margin-top:13px;color:var(--muted)">What you <i>do</i> get is §11.42(e): a person qualifying for §11.131 after January 1 may receive the exemption for the applicable portion of that tax year immediately on qualification, prorated by day under §26.1125. On a property that is your residence homestead. So a mid-year award is not a lost year — it is a partial one.</p></div></section>';

  return o;
}

function renderTree(){

  for(var i=0;i<3;i++){ o+='<span class="dot'+(i<depth?" done":(i===depth?" on":""))+'"></span>'; }

  var node=state.node;
  if(TREE[node]){
    var q=TREE[node];
    o+='<div class="tree-body"><div class="q">'+q.q+'</div><p class="q-note">'+q.note+'</p><div class="opts">';

    if(out.p2){ o+='<p style="margin-top:12px;color:var(--muted)">'+out.p2+'</p>'; }
    o+='<ol class="do-list">';
    for(var k=0;k<out.steps.length;k++){ o+='<li><span class="do-n">'+(k+1)+'</span><span>'+out.steps[k]+'</span></li>'; }

  }

  o+='<div class="tree-foot"><button class="btn" data-act="reset">Start over</button>';
  if(depth>0){ o+='<button class="btn" data-act="back">Back</button>'; }
  o+='<span class="trail">'+(depth===0?"Question 1 of 3":(TREE[node]?"Question "+(depth+1)+" of 3":"Result · "+depth+" answers"))+'</span></div>';
  el.innerHTML=o;

  var btns=el.querySelectorAll("[data-go]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){
      state.trail.push(state.node);
      state.node=this.getAttribute("data-go");
      renderTree();

  var acts=el.querySelectorAll("[data-act]");

    acts[a].addEventListener("click",function(){
      if(this.getAttribute("data-act")==="reset"){ state.node="q1"; state.trail=[]; }
      else { state.node=state.trail.pop()||"q1"; }
      renderTree();
    });
  }
}

function renderActions(){

  var o='<section class="panel flat"><div class="eyebrow">Working list</div><h2 class="sec-h">Actions</h2>';
  o+='<p class="lede" style="margin:10px 0 20px">Ordered by dollars recovered per hour of your time. The recurring savings are real but modest — call it a hundred a month. The money that moves the needle is the funding fee refund and the SMC/SSDI income side, and both hinge on two documents: your closing disclosure and your rating decision letter.</p>';
  o+='<div class="prog-wrap"><span class="stat-num" style="font-family:var(--disp);font-size:30px;font-weight:700;color:var(--brass)">'+done+'<span style="color:var(--muted-2);font-size:20px">/'+total+'</span></span>';
  o+='<div class="prog"><i style="width:'+pct+'%"></i></div>';
  o+='<span class="save-note">Saved on this device</span></div>';

    for(var j=0;j<TASKS.length;j++){
      var k=TASKS[j]; if(k.tier!==tn) continue;
      var isDone=!!state.done[k.id];
      o+='<label class="task'+(isDone?" done":"")+'" data-sev="'+k.sev+'">';
      o+='<input type="checkbox" data-id="'+k.id+'"'+(isDone?" checked":"")+' aria-label="'+esc(k.t)+'">';

      if(k.meta.length){
        o+='<span class="task-meta">';

function qualifies(b){
  var r=effRating();
  if(!r) return true;                       /* no rating set — show everything */
  if(b.pt && !state.pt) return false;       /* P&T-gated */
  return r >= (b.min||0);
}

function renderGrid(){
  var g=document.getElementById("bgrid"); if(!g) return;
  var o='', shown=0, gated=0;
  for(var i=0;i<BENEFITS.length;i++){
    var b=BENEFITS[i];
    if(state.filter!=="all" && b.c!==state.filter) continue;
    var ok=qualifies(b);
    if(!ok){ gated++; if(!state.showAll) continue; }
    shown++;
    o+='<article class="card'+(ok?'':' gated')+'"><h4>'+b.n+'</h4><div class="val">'+b.v+'</div><p>'+b.d+'</p><div class="chip-row">';
    for(var t=0;t<b.tags.length;t++){
      var glyph=b.tags[t][0]==="ok"?"✓ ":(b.tags[t][0]==="check"?"? ":"! ");
      o+=chip(b.tags[t][0],glyph+b.tags[t][1]);
    }
    if(!ok){
      o+=chip("", b.pt && !state.pt ? "Needs P&amp;T" : "Needs "+(b.min)+"%");
    }
    o+='</div><div class="src">'+b.s+'</div></article>';
  }
  g.innerHTML=o;

  var gb=document.getElementById("gatebar");
  if(gb){
    if(!effRating()){
      gb.innerHTML='<p>Showing all '+BENEFITS.length+' entries. <b>Set your rating in the header</b> to see only what you actually qualify for.</p>';
    } else if(gated===0){
      gb.innerHTML='<p>At <b>'+effRating()+'%'+(state.pt?' P&amp;T':'')+'</b>, everything in this filter applies to you.</p>';
    } else {
      gb.innerHTML='<p>At <b>'+effRating()+'%'+(state.pt?' P&amp;T':'')+'</b>: <b>'+shown+'</b> apply, '+gated+' need a higher rating or P&amp;T.</p>'+
        '<button class="btn" id="togglegate">'+(state.showAll?"Hide the rest":"Show the rest")+'</button>';
      var tg=document.getElementById("togglegate");
      if(tg) tg.addEventListener("click",function(){ state.showAll=!state.showAll; renderGrid(); });
    }
  }
  var fb=document.querySelectorAll("#filters button");
  for(var f=0;f<fb.length;f++){
    fb[f].setAttribute("aria-pressed", fb[f].getAttribute("data-cat")===state.filter ? "true":"false");
  }
}

  /* highest rung the selected rating reaches; null when no rating is set */
  var r=effRating(), cur=null;
  if(r){
    for(var z=0;z<LADDER.length;z++){
      if(LADDER[z].v<=r) cur=LADDER[z].v;
    }
    if(state.pt) cur=101;
  }
  var o='<section class="panel flat"><div class="eyebrow">Scales with the rating</div><h2 class="sec-h">Threshold ladder</h2>';
  o+='<p class="lede" style="margin:10px 0 18px">The thresholds are easy to confuse because no two programs share one. Driver license fee waiver needs 60%. DV plates need 50%. The parks passport needs 60% but the hunting and fishing license needs 50%. Property tax starts at 10%.</p>';
  o+='<div class="ladder">';
  for(var i=0;i<LADDER.length;i++){
    var r=LADDER[i];
    var here = cur!==null && r.v===cur;
    o+='<div class="rung'+(here?" you":"")+'"><div class="rung-n">'+r.n+'</div><div class="rung-b"><h4>'+r.h+(here?' — you are here':'')+'</h4><ul>';
    for(var j=0;j<r.items.length;j++){ o+='<li>'+r.items[j]+'</li>'; }
    o+='</ul></div></div>';
  }
  o+='</div></section>';

  o+='<section class="panel flat" style="margin-top:34px"><div class="eyebrow">Keeping this current</div><h2 class="sec-h">Upkeep calendar</h2>';
  o+='<p class="lede" style="margin:10px 0 18px">Six months carry a hard trigger. Everything in this reference has a shelf life — rates move on a federal fiscal calendar, statutes move on the Texas legislative one.</p>';
  o+='<div class="months">';
  for(var m=0;m<MONTHS.length;m++){
    o+='<div class="mo'+(MONTHS[m].hit?" hit":"")+'"><div class="mo-n">'+MONTHS[m].m+'</div><p>'+MONTHS[m].p+'</p></div>';

  o+='</div></section>';

var RATES=[0,10,30,50,60,70,100];

function effRating(){ return state.rating||0; }

function renderRatePick(){
  var el=document.getElementById("ratepick"); if(!el) return;
  var o='';
  for(var i=1;i<RATES.length;i++){
    o+='<button type="button" data-rate="'+RATES[i]+'" aria-pressed="'+(state.rating===RATES[i])+'">'+RATES[i]+'%</button>';
  }
  o+='<span class="sep" aria-hidden="true"></span>';
  o+='<button type="button" data-pt="1" aria-pressed="'+(!!state.pt)+'" title="Permanent &amp; Total">P&amp;T</button>';
  el.innerHTML=o;
  document.body.classList.toggle("has-rating", !!state.rating);

  var bs=el.querySelectorAll("button");
  for(var b=0;b<bs.length;b++){
    bs[b].addEventListener("click",function(){
      if(this.hasAttribute("data-pt")){
        state.pt=!state.pt;
        if(state.pt && state.rating<100) state.rating=100;
      } else {
        var r=parseInt(this.getAttribute("data-rate"),10);
        state.rating = (state.rating===r) ? 0 : r;
        if(state.rating<100) state.pt=false;
      }
      save(); renderRatePick(); draw();
    });
  }
}

function renderNav(){
  var n=document.getElementById("nav"), o='';

function draw(){
  var root=document.getElementById("app-root");
  var body="";

  else if(state.tab==="thresholds") body=renderThresholds();
  else body=renderContacts();

  root.innerHTML='<div class="stack">'+body+'</div>'+
    '<p class="foot"><b style="color:var(--bone)">Not legal or tax advice.</b> This is a research summary compiled from primary statutory and .gov sources with a second adversarial verification pass. Every entry carries a grade: <b>✓ Verified</b> was confirmed against a primary source; <b>? Verify</b> needs a phone call before you rely on it. Your facts are not the facts this was written against — property tax in particular turns on ownership and occupancy on January 1 of each specific year, and a disputed exemption is worth an hour of a Texas property tax attorney’s time.<br><br>Figures have a shelf life. VA rates change every December 1 (COLA). Federal grant maximums change October 1. Texas statutes take effect September 1 of odd-numbered years. Check the date in the header against today before acting on a dollar amount.<br><br>Scoped to the Austin metro — Hays and Travis counties — though the federal and statewide entries apply anywhere in Texas. Your rating and checkbox progress are stored in this browser on this device; nothing is transmitted anywhere and there is no analytics on this page.<br><br>Compiled by <b style="color:var(--brass)">Rowan Risk Solutions LLC</b>, Buda TX — published for other veterans because the information is hard to assemble and easy to get wrong. Corrections welcome.</p>';

  if(state.tab==="homestead") renderTree();
  if(state.tab==="benefits"){
    renderGrid();
    var fb=document.querySelectorAll("#filters button");
    for(var f=0;f<fb.length;f++){
      fb[f].addEventListener("click",function(){ state.filter=this.getAttribute("data-cat"); renderGrid(); });
    }
  }
  if(state.tab==="actions"){
    var cbs=document.querySelectorAll(".task input[type=checkbox]");
    for(var c=0;c<cbs.length;c++){
      cbs[c].addEventListener("change",function(){
        var id=this.getAttribute("data-id");
        if(this.checked) state.done[id]=1; else delete state.done[id];
        save();
        this.closest(".task").classList.toggle("done",this.checked);
        var total=TASKS.length,done=0;
        for(var i=0;i<TASKS.length;i++){ if(state.done[TASKS[i].id]) done++; }
        var bar=document.querySelector(".prog i"); if(bar) bar.style.width=Math.round(done/total*100)+"%";
        var num=document.querySelector(".prog-wrap .stat-num");
        if(num) num.innerHTML=done+'<span style="color:var(--muted-2);font-size:20px">/'+total+'</span>';
      });
    }
  }
  var nb=document.querySelectorAll("#nav [data-tab]");
  for(var q=0;q<nb.length;q++){ nb[q].setAttribute("aria-selected", nb[q].getAttribute("data-tab")===state.tab?"true":"false"); }
}

  installBtn.addEventListener("click",function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt=null; installBtn.hidden=true; });
  });
}
window.addEventListener("appinstalled",function(){ if(installBtn) installBtn.hidden=true; });

function netState(){ document.body.classList.toggle("is-offline", !navigator.onLine); }
window.addEventListener("online",netState);
window.addEventListener("offline",netState);
netState();
})();
</script>

</body>
